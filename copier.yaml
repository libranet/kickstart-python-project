# Copier configuration for kickstart-python-project
# https://copier.readthedocs.io/en/stable/configuring/

_min_copier_version: "9.0.0"

# Template is in the 'template' subdirectory
_subdirectory: template

# Only files with .jinja suffix are rendered
_templates_suffix: .jinja

# Answer file location in generated projects
_answers_file: .copier-answers.yml

# Exclude patterns (files not to copy to destination)
_exclude:
  - copier.yaml
  - copier.yml
  - "*.pyc"
  - __pycache__
  - .git
  - .DS_Store
  - "*.bak"

# Skip these files if they already exist (preserves user customizations on update)
_skip_if_exists:
  - .env
  - "var/**"

# Jinja2 extensions for additional filters
_jinja_extensions:
  - jinja2_time.TimeExtension

# =============================================================================
# Questions
# =============================================================================

project_name:
  type: str
  help: "Project name (lowercase with dashes, e.g., my-awesome-project)"
  placeholder: "My New App"
  validator: >-
    {% if not (project_name | regex_search('^[a-z](?:[a-z0-9-]*[a-z0-9])?$')) %}
    Must be lowercase, start with letter, use only letters/numbers/dashes
    {% endif %}

package_name:
  type: str
  help: "Python package name (auto-derived from project name)"
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$'))
       or package_name in ['and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue',
                          'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global',
                          'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass',
                          'raise', 'return', 'try', 'while', 'with', 'yield'] %}
    Must be a valid Python identifier (lowercase, underscores allowed)
    {% endif %}

description:
  type: str
  help: "Short project description"
  placeholder: "A Python project."

author:
  type: str
  help: "Author full name"
  placeholder: "John Smith"
  validator: >-
    {% if not author %}
    Invalid author name
    {% endif %}

email:
  type: str
  help: "Author email address"
  placeholder: "john.smith@example.com"
  validator: >-
    {% if not "@" in email %}
    Invalid author email address
    {% endif %}

git_platform:
  type: str
  help: "Git hosting platform"
  choices:
    - github
    - gitlab
  default: github

github_user:
  type: str
  help: "GitHub/GitLab username or organization"
  default: ""

version:
  type: str
  help: "Initial project version"
  default: "0.1dev0"

license:
  type: str
  help: "Project license"
  choices:
    - MIT
    - Apache-2.0
    - GPL-3.0
  default: MIT

license_spdx:
  type: str
  help: "SPDX license expression (PEP 639), derived from license"
  default: "{% if license == 'GPL-3.0' %}GPL-3.0-or-later{% else %}{{ license }}{% endif %}"
  when: false

development_status:
  type: str
  help: "PyPI development status classifier"
  choices:
    "1 - Planning": "Development Status :: 1 - Planning"
    "2 - Pre-Alpha": "Development Status :: 2 - Pre-Alpha"
    "3 - Alpha": "Development Status :: 3 - Alpha"
    "4 - Beta": "Development Status :: 4 - Beta"
    "5 - Production/Stable": "Development Status :: 5 - Production/Stable"
  default: "Development Status :: 4 - Beta"

minimum_python:
  type: str
  help: "Minimum Python version"
  choices:
    - "3.14"
    - "3.13"
    - "3.12"
    - "3.11"
    - "3.10"
  default: "3.14"

# -----------------------------------------------------------------------------
# Feature toggles
# -----------------------------------------------------------------------------

with_cyclopts:
  type: bool
  help: "Include CLI support with cyclopts?"
  default: true

with_django:
  type: bool
  help: "Include Django framework?"
  default: false

with_flask:
  type: bool
  help: "Include Flask framework?"
  default: false

with_fastapi:
  type: bool
  help: "Include FastAPI framework?"
  default: false

with_postgres:
  type: bool
  help: "Include PostgreSQL database support?"
  default: false
  when: "{{ with_django or with_fastapi or with_flask }}"

support_rtd:
  type: bool
  help: "Include ReadTheDocs configuration?"
  default: false

with_renovate_python:
  type: bool
  help: "Let Renovate also update Python dependencies? (GitHub Actions are always updated)"
  default: false
  when: "{{ git_platform == 'github' }}"

# -----------------------------------------------------------------------------
# Computed variables (not prompted)
# -----------------------------------------------------------------------------

copyright_year:
  type: str
  default: "{{ '%Y' | strftime }}"
  when: false

# =============================================================================
# Tasks (post-generation commands)
# =============================================================================

_tasks:
  # Create directory structure
  - command: just install
    when: "{{ _copier_operation == 'copy' }}"
    working_directory: "."

  # Initialize git repository
  - command: git init
    when: "{{ _copier_operation == 'copy' }}"
    working_directory: "."

  # Install pre-commit hooks
  # - command: uv run pre-commit install
  #   when: "{{ _copier_operation == 'copy' }}"
  #   working_directory: "."

  # Fall back to the template author/email when no git identity is configured
  - command:
      - "{{ _copier_python }}"
      - -c
      - >-
        import subprocess, sys;
        [subprocess.run(['git', 'config', key, value], check=True)
        for key, value in zip(['user.name', 'user.email'], sys.argv[1:])
        if subprocess.run(['git', 'config', '--get', key], capture_output=True).returncode]
      - "{{ author }}"
      - "{{ email }}"
    when: "{{ _copier_operation == 'copy' }}"
    working_directory: "."

  # Initial commit
  - command: git add -A && git commit -m "Initial commit from copier template"
    when: "{{ _copier_operation == 'copy' }}"
    working_directory: "."

